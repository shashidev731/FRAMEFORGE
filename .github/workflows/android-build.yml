name: Android build
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - name: Prepare optional release signing
        env:
          FRAMEFORGE_KEYSTORE_BASE64: ${{ secrets.FRAMEFORGE_KEYSTORE_BASE64 }}
          FRAMEFORGE_KEYSTORE_PASSWORD: ${{ secrets.FRAMEFORGE_KEYSTORE_PASSWORD }}
          FRAMEFORGE_KEY_ALIAS: ${{ secrets.FRAMEFORGE_KEY_ALIAS }}
          FRAMEFORGE_KEY_PASSWORD: ${{ secrets.FRAMEFORGE_KEY_PASSWORD }}
        run: |
          if [ -n "${FRAMEFORGE_KEYSTORE_BASE64:-}" ]; then
            keystore="$RUNNER_TEMP/frameforge-release.keystore"
            printf '%s' "$FRAMEFORGE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
            test -s "$keystore"
            {
              echo "FRAMEFORGE_RELEASE_STORE_FILE=$keystore"
              echo "FRAMEFORGE_RELEASE_STORE_PASSWORD=$FRAMEFORGE_KEYSTORE_PASSWORD"
              echo "FRAMEFORGE_RELEASE_KEY_ALIAS=$FRAMEFORGE_KEY_ALIAS"
              echo "FRAMEFORGE_RELEASE_KEY_PASSWORD=$FRAMEFORGE_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "A release keystore was provided; the release APK will be signed."
          else
            echo "No release keystore configured; the release APK will remain unsigned."
          fi
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Run lint
        run: |
          set +e
          gradle :app:lintDebug --stacktrace
          lint_status=$?
          echo "----- LOCATE ANDROID LINT REPORTS -----"
          find app/build -type f \( -name "lint-results-debug.txt" -o -name "lint-results-debug.html" \) -print -exec sh -c 'case "$1" in *.txt) cat "$1";; esac' _ {} \;
          exit "$lint_status"
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frameforge-lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: warn
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace
      - name: Validate APK outputs
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          release_dir="app/build/outputs/apk/release"
          if [ -s "$release_dir/app-release.apk" ]; then
            release_apk="$release_dir/app-release.apk"
            release_signing="signed"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$release_apk"
          elif [ -s "$release_dir/app-release-unsigned.apk" ]; then
            release_apk="$release_dir/app-release-unsigned.apk"
            release_signing="unsigned"
          else
            echo "No release APK was generated." >&2
            exit 1
          fi
          unzip -t "$release_apk" >/dev/null
          echo "RELEASE_APK_PATH=$release_apk" >> "$GITHUB_ENV"
          echo "RELEASE_APK_SIGNING=$release_signing" >> "$GITHUB_ENV"
          echo "Release artifact: $release_apk ($release_signing)" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: frameforge-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: frameforge-release-${{ env.RELEASE_APK_SIGNING }}-apk
          path: ${{ env.RELEASE_APK_PATH }}
          if-no-files-found: error

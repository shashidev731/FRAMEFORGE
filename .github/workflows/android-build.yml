name: Android build
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Run lint
        run: |
          set +e
          gradle :app:lintDebug --stacktrace
          lint_status=$?
          echo "----- LOCATE ANDROID LINT REPORTS -----"
          find app/build -type f \( -name "lint-results-debug.txt" -o -name "lint-results-debug.html" \) -print -exec sh -c 'case "$1" in *.txt) cat "$1";; esac' _ {} \;
          exit "$lint_status"
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frameforge-lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: warn
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace
      - name: Validate APK outputs
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: frameforge-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: frameforge-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
